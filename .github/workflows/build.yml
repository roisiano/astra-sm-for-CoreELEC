name: Build Astra-sm for CoreELEC (aarch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            make \
            pkg-config \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            gettext \
            m4 \
            tree \
            file \
            binutils

      - name: Clone Astra-sm
        run: |
          git clone https://github.com/crazycat69/astra-sm.git
          cd astra-sm

          echo "===== ROOT ====="
          ls -al

          echo "===== TREE ====="
          tree -L 3 || true

      - name: Show build files
        run: |
          cd astra-sm

          echo "===== BUILD FILES ====="

          find . -name configure
          find . -name configure.ac
          find . -name autogen.sh
          find . -name Makefile.am
          find . -name Makefile.in

      - name: Regenerate build system if needed
        run: |
          cd astra-sm

          if [ ! -f configure ]; then
            echo "Generating configure..."

            chmod +x autogen.sh || true

            if [ -f autogen.sh ]; then
              ./autogen.sh
            fi
          fi

          ls -al

      - name: Configure
        run: |
          cd astra-sm

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          chmod +x configure

          ./configure \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu

      - name: Build
        run: |
          cd astra-sm

          make -j"$(nproc)"

      - name: Search binaries
        if: always()
        run: |
          cd astra-sm

          echo "===== EXECUTABLES ====="
          find . -type f -executable | sort

          echo "===== ELF FILES ====="
          find . -type f -exec file {} \; | grep ELF || true

      - name: Create IPK
        run: |
          cd astra-sm

          mkdir -p package/CONTROL
          mkdir -p package/usr/bin

          BIN=$(find . -type f -name astra | head -n 1)

          if [ -z "$BIN" ]; then
            echo "ERROR: astra binary not found"
            exit 1
          fi

          echo "Using binary: $BIN"

          cp "$BIN" package/usr/bin/astra
          chmod 755 package/usr/bin/astra

          echo "Package: astra-sm" > package/CONTROL/control
          echo "Version: 1.0" >> package/CONTROL/control
          echo "Architecture: aarch64" >> package/CONTROL/control
          echo "Maintainer: GitHub Actions" >> package/CONTROL/control
          echo "Description: Astra-sm for CoreELEC" >> package/CONTROL/control

          cd package

          tar czf control.tar.gz CONTROL
          tar czf data.tar.gz usr

          echo "2.0" > debian-binary

          ar rcs ../astra-sm_1.0_aarch64.ipk \
            debian-binary \
            control.tar.gz \
            data.tar.gz

      - name: Verify package
        run: |
          cd astra-sm

          ls -lh astra-sm_1.0_aarch64.ipk

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: astra-sm_aarch64
          path: astra-sm/astra-sm_1.0_aarch64.ipk

      - name: Upload debug tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sm-debug-tree
          path: astra-sm

