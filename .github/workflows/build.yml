name: Build Astra-sm for CoreELEC (aarch64)

on:
  workflow_dispatch:

jobs:
  build-astra-sm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            gettext \
            make

      - name: Clone Astra-sm
        run: |
          git clone https://github.com/crazycat69/astra-sm.git
          cd astra-sm
          ls -alh

      - name: Configure Astra-sm
        run: |
          cd astra-sm

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          chmod +x configure || true

          ./configure \
            --host=aarch64-linux-gnu

      - name: Build Astra-sm
        run: |
          cd astra-sm
          make -j$(nproc)

      - name: Locate generated binary
        run: |
          cd astra-sm
          find . -type f -executable | sort

      - name: Create IPK package
        run: |
          cd astra-sm

          mkdir -p package/CONTROL
          mkdir -p package/usr/bin

          ASTRA_BIN=$(find . -type f -name astra | head -n 1)

          if [ -z "$ASTRA_BIN" ]; then
            echo "ERROR: Binary 'astra' not found"
            exit 1
          fi

          cp "$ASTRA_BIN" package/usr/bin/astra
          chmod 755 package/usr/bin/astra

          cat > package/CONTROL/control << EOF
          Package: astra-sm
          Version: 1.0
          Architecture: aarch64
          Maintainer: GitHub Actions
          Description: Astra-sm for CoreELEC
          EOF

          cd package

          tar czf control.tar.gz CONTROL
          tar czf data.tar.gz usr

          echo "2.0" > debian-binary

          ar rcs ../astra-sm_1.0_aarch64.ipk \
            debian-binary \
            control.tar.gz \
            data.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-sm_aarch64
          path: astra-sm/astra-sm_1.0_aarch64.ipk


