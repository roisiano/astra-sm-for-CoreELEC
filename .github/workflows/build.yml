name: Debug Build Astra-sm

on:
  workflow_dispatch:

jobs:
  debug-astra:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            gettext \
            pkg-config \
            make \
            tree

      - name: Clone repository
        run: |
          git clone https://github.com/crazycat69/astra-sm.git
          cd astra-sm

          echo "========================="
          echo "ROOT DIRECTORY CONTENTS"
          echo "========================="

          ls -al

          echo
          echo "========================="
          echo "COMPLETE TREE"
          echo "========================="

          tree -L 3

      - name: Detect build files
        run: |
          cd astra-sm

          echo
          echo "Searching build files..."

          find . -name configure
          find . -name configure.ac
          find . -name configure.in
          find . -name autogen.sh
          find . -name Makefile.am
          find . -name Makefile.in

      - name: Show configure.ac
        run: |
          cd astra-sm

          if [ -f configure.ac ]; then
            echo "configure.ac found"
            sed -n '1,150p' configure.ac
          else
            echo "configure.ac NOT found"
          fi

      - name: Show autogen.sh
        run: |
          cd astra-sm

          if [ -f autogen.sh ]; then
            echo "autogen.sh found"
            sed -n '1,200p' autogen.sh
          else
            echo "autogen.sh NOT found"
          fi

      - name: Run autogen with debugging
        run: |
          cd astra-sm

          if [ -f autogen.sh ]; then
            chmod +x autogen.sh
            bash -x ./autogen.sh
          else
            echo "autogen.sh not present"
          fi

      - name: Show generated files
        if: always()
        run: |
          cd astra-sm

          echo
          echo "AFTER AUTOGEN"

          find . -maxdepth 2 -name configure
          find . -maxdepth 2 -name Makefile.in

      - name: Configure manually
        if: always()
        run: |
          cd astra-sm

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          if [ -f configure ]; then
            ./configure --host=aarch64-linux-gnu
          else
            echo "configure was not generated"
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-debug
          path: astra-sm


